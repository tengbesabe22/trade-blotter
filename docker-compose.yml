# First-time database setup still uses the existing db:migrate:dev and db:seed commands.
# Start both services with: docker compose up --build -d --wait
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Compiled API, with local HTTP cookies. The image defaults to production.
      NODE_ENV: development
      DATABASE_URL: postgresql://blotter:blotter@postgres:5432/blotter?schema=public
      APP_ORIGIN: http://localhost:5173
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blotter
      POSTGRES_PASSWORD: blotter
      POSTGRES_DB: blotter
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blotter -d blotter']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
